        function init() {
            const select = document.getElementById('monthSelect');
            if (!rawData || rawData.length === 0) {
                select.innerHTML = '<option>데이터가 없습니다</option>';
                return;
            }
            const months = new Set();
            rawData.forEach(d => months.add(d.date_str.substring(0, 7)));
            const sortedMonths = Array.from(months).sort().reverse();
            select.innerHTML = '';
            sortedMonths.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.text = m;
                select.appendChild(opt);
            });
            if (sortedMonths.length > 0) {
                select.value = sortedMonths[0];
                updateDashboard();
            }
        }

        function updateDashboard() {
            const month = document.getElementById('monthSelect').value;
            const data = rawData.filter(d => d.date_str.startsWith(month));
            const chartData = [...data].sort((a,b) => a.date_str.localeCompare(b.date_str));

            let sum = 0;
            chartData.forEach(d => sum += d.mbytes);
            // 평균값 소수점 없이 정수로 (toFixed(0))
            const avg = chartData.length ? (sum / chartData.length).toFixed(0) : 0;
            
            document.getElementById('avgText').innerText = `💡 ${month} 일평균: ${Number(avg).toLocaleString()} MB`;
            
            if (chartData.length > 0) {
                const minRow = chartData.reduce((prev, curr) => prev.mbytes < curr.mbytes ? prev : curr);
                const maxRow = chartData.reduce((prev, curr) => prev.mbytes > curr.mbytes ? prev : curr);
                const sortedMbytes = chartData.map(d => d.mbytes).sort((a, b) => a - b);
                const mid = Math.floor(sortedMbytes.length / 2);
                let median = 0;
                if (sortedMbytes.length % 2 !== 0) {
                    median = sortedMbytes[mid];
                } else {
                    // 중간값 소수점 없이 정수로 (toFixed(0))
                    median = ((sortedMbytes[mid - 1] + sortedMbytes[mid]) / 2).toFixed(0);
                }

                document.getElementById('minDate').innerText = minRow.date_str;
                document.getElementById('minVal').innerText = Number(minRow.mbytes).toLocaleString();
                document.getElementById('maxDate').innerText = maxRow.date_str;
                document.getElementById('maxVal').innerText = Number(maxRow.mbytes).toLocaleString();
                document.getElementById('avgValTable').innerText = Number(avg).toLocaleString();
                document.getElementById('medianVal').innerText = Number(median).toLocaleString();
            }

            const tbody = document.querySelector('#trafficTable tbody');
            tbody.innerHTML = '';
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${row.date_str}</td><td>${Number(row.mbytes).toLocaleString()} MB</td>`;
                tbody.appendChild(tr);
            });

            const ctx = document.getElementById('trafficChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.map(d => d.date_str.slice(8,10) + '일'),
                    datasets: [{
                        label: '사용량 (MB)',
                        data: chartData.map(d => d.mbytes),
                        borderColor: '#2196F3',
                        backgroundColor: 'rgba(33, 150, 243, 0.1)',
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: { 
                    responsive: true,
                    scales: {
                        y: {
                            ticks: {
                                callback: function(value) {
                                    return value.toLocaleString();
                                }
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toLocaleString() + ' MB';
                                }
                            }
                        }
                    }
                }
            });
        }
